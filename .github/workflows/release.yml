name: Build and Release

on:
  push:
    tags:
      - "v*" # Only run on version tags like v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build binary
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          FLAGS="-ldflags -X main.version=${VERSION}"
          GOOS=darwin GOARCH=amd64 go build ${FLAGS} -o dist/narrowcast-darwin-amd64 .
          GOOS=linux GOARCH=amd64 go build ${FLAGS} -o dist/narrowcast-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build ${FLAGS} -o dist/narrowcast-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build ${FLAGS} -o dist/narrowcast-windows-amd64.exe .

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
