# Copy to config.yaml and edit for your interests.

topics:
  - technology
  - science

keywords:
  - raspberry pi
  - open source
  - climate

exclude:
  - crypto
  - sports

match_mode: any       # any | all
match_style: word     # substring | word (word avoids "go" in "cargo")

max_age: 48h
max_per_cycle: 5
pause_between: 2s

# Plain URLs or labeled entries. Optional OPML merges more feeds.
feeds:
  - url: https://hnrss.org/frontpage
    label: Hacker News
  - https://www.reddit.com/r/golang/.rss

# opml: subscriptions.opml

schedule:
  interval: 30m

state:
  file: .narrowcast/seen.json
  persist: false
  ttl: 168h
  max_entries: 2000

audio:
  # macOS: use `say` (built-in) — no Homebrew TTS deps required.
  # Linux/Pi: piper or espeak-ng, then mock.
  engine: auto
  fallback: [say, piper, espeak, mock]   # say is skipped off macOS
  max_summary_chars: 400
  max_utterance_chars: 2500
  say:
    voice: Samantha   # optional — list with: say -v ?
    rate: 180         # words per minute
  espeak:
    binary: espeak-ng
    voice: en
    speed: 160
  piper:
    binary: piper
    model: /usr/share/piper/en_US-lessac-medium.onnx
    play_binary: aplay
  elevenlabs:
    # api_key: ""                    # prefer env var (do not commit secrets)
    api_key_env: ELEVENLABS_API_KEY
    voice_id: ""                     # from ElevenLabs voice library
    model_id: eleven_turbo_v2_5
    play_binary: afplay             # macOS; use mpv or mpg123 on Linux
    timeout: 60s
  kokoro:
    script: /home/pi/bin/kokoro-speak.sh
    args: []                         # extra args passed before stdin is attached
